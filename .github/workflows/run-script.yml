name: Run OLX and Flights Scripts

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours

jobs:
  olx-script:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      OLX_DB_ID: ${{ secrets.OLX_DB_ID }}
      FLIGHTS_DB_ID: ${{ secrets.FLIGHTS_DB_ID }}
      TOKYO_DB_ID: ${{ secrets.TOKYO_DB_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgtk-3-0 \
            libgbm1 libnss3 libasound2t64 libatk1.0-0 libatk-bridge2.0-0 \
            libdrm2 libxext6 libxfixes3 libxrender1 libxcb1 libxcursor1 \
            libxinerama1 libpango-1.0-0 libcups2 libdbus-1-3 \
            libgdk-pixbuf2.0-0 libglib2.0-0 libxss1 fonts-liberation

      - name: Run OLX script
        run: timeout 300s npx tsx src/index.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OLX_DB_ID: ${{ secrets.OLX_DB_ID }}

  flights-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgtk-3-0 \
            libgbm1 libnss3 libasound2t64 libatk1.0-0 libatk-bridge2.0-0 \
            libdrm2 libxext6 libxfixes3 libxrender1 libxcb1 libxcursor1 \
            libxinerama1 libpango-1.0-0 libcups2 libdbus-1-3 \
            libgdk-pixbuf2.0-0 libglib2.0-0 libxss1 fonts-liberation

      - name: Run Flights script
        run: timeout 300s npx tsx src/views/flights.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FLIGHTS_DB_ID: ${{ secrets.FLIGHTS_DB_ID }}

  tokyo-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgtk-3-0 \
            libgbm1 libnss3 libasound2t64 libatk1.0-0 libatk-bridge2.0-0 \
            libdrm2 libxext6 libxfixes3 libxrender1 libxcb1 libxcursor1 \
            libxinerama1 libpango-1.0-0 libcups2 libdbus-1-3 \
            libgdk-pixbuf2.0-0 libglib2.0-0 libxss1 fonts-liberation

      - name: Run Tokyo script
        run: timeout 300s npx tsx src/views/tokyo.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TOKYO_DB_ID: ${{ secrets.TOKYO_DB_ID }}
