name: Run OLX and Flights Scripts

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgtk-3-0 \
            libgbm1 libnss3 libasound2t64 libatk1.0-0 libatk-bridge2.0-0 \
            libdrm2 libxext6 libxfixes3 libxrender1 libxcb1 libxcursor1 \
            libxinerama1 libpango-1.0-0 libcups2 libdbus-1-3 \
            libgdk-pixbuf2.0-0 libglib2.0-0 libxss1 fonts-liberation

      - name: Run all scripts in parallel
        run: |
          timeout 300s npx tsx src/index.ts \
            --env NOTION_TOKEN="${{ secrets.NOTION_TOKEN }}" \
            --env OLX_DB_ID="${{ secrets.OLX_DB_ID }}" &

          timeout 300s npx tsx src/views/flights.ts \
            --env NOTION_TOKEN="${{ secrets.NOTION_TOKEN }}" \
            --env FLIGHTS_DB_ID="${{ secrets.FLIGHTS_DB_ID }}" &

          timeout 300s npx tsx src/views/tokyo.ts \
            --env NOTION_TOKEN="${{ secrets.NOTION_TOKEN }}" \
            --env TOKYO_DB_ID="${{ secrets.TOKYO_DB_ID }}" &

          wait
